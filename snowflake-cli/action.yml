# snowflake-cli/action.yml
#
# Installs only the Snowflake CLI (snow). This is the leaf form of the root
# action's Snowflake CLI path — use it when you want to be explicit about
# installing just the CLI:
#
#   uses: snowflakedb/snowflake-actions/snowflake-cli@v3
#
# The root action (snowflakedb/snowflake-actions@v3) installs the Snowflake CLI
# by default and can additionally install the Cortex Code CLI; this leaf exists
# for callers who want an unambiguous, CLI-only entry point.
name: "Snowflake CLI"
description: "Install and configure the Snowflake CLI (snow) for CI/CD workflows."
branding:
  icon: "terminal"
  color: "blue"

inputs:
  cli-version:
    description: >-
      Snowflake CLI version to install (e.g. 3.20.0). An omitted value is empty.
      Empty reuses a snow already on PATH and does not download. That reuse
      exports SNOWFLAKE_CLI_AIR_GAPPED=true for later steps, unless the variable
      is already set or an earlier step installed the CLI from the network.
      If snow is not on PATH, empty installs the latest release from PyPI.
      The string latest always installs from PyPI.
    required: false

  default-config-file-path:
    description: "Path to the default config file"
    required: false
    default: "./config.toml"

  custom-github-ref:
    description: "GitHub branch, tag, or commit to install from (if set, installs from GitHub; otherwise, installs from PyPI)"
    required: false

  cli-artifact:
    description: >-
      Path to a local Snowflake CLI wheel, sdist, or directory of wheels.
      Installed with uv --offline (no PyPI). uv and python3 must already be on PATH.
      Mutually exclusive with cli-version and custom-github-ref. This path exports
      SNOWFLAKE_CLI_AIR_GAPPED=true for later steps unless that variable is already
      set. Air-gapped runners can instead preinstall snow on PATH and leave
      cli-version, custom-github-ref, and cli-artifact empty to skip the download.
    required: false
    default: ""

  use-oidc:
    description: "Enable OIDC authentication"
    required: false
    default: "false"

  oidc-token-name:
    description: >-
      Name of the token environment variable for OIDC authentication. By default it is set for
      temporary connections
      (https://docs.snowflake.com/en/developer-guide/snowflake-cli/connecting/configure-connections#use-a-temporary-connection);
      change it to SNOWFLAKE_CONNECTIONS_<NAME>_TOKEN to work with named connections.
    required: false
    default: "SNOWFLAKE_TOKEN"

  oidc-audience:
    description: >-
      Audience (aud) claim requested for the GitHub OIDC token. An omitted value
      is empty. Empty uses SNOWFLAKE_AUDIENCE when that is already set. Otherwise
      the action requests snowflakecomputing.com, unless SNOWFLAKE_CLI_AIR_GAPPED
      is true, in which case oidc-audience or SNOWFLAKE_AUDIENCE must be set.
    required: false
    default: ""

outputs:
  snowflake-cli-version:
    description: "Installed Snowflake CLI version"
    value: ${{ steps.version.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Set up action environment
      shell: bash
      run: bash $GITHUB_ACTION_PATH/../scripts/setup-environment.sh

    # See the root action.yml for why `python-version` is intentionally omitted.
    # Keep the pinned setup-uv SHA in sync with the root action.yml.
    # setup-uv downloads uv from GitHub Releases, so air-gapped runs skip it
    # when snow is already on PATH or cli-artifact is set.
    - name: Plan Snowflake CLI install
      id: snow-plan
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        CUSTOM_GITHUB_REF: ${{ inputs.custom-github-ref }}
        CLI_ARTIFACT: ${{ inputs.cli-artifact }}
      run: bash $GITHUB_ACTION_PATH/../scripts/plan-snowflake-cli-install.sh

    - if: ${{ steps.snow-plan.outputs.skip_uv_setup != 'true' }}
      uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 #v7.1.6

    - name: Install Snowflake CLI
      if: ${{ steps.snow-plan.outputs.skip_install != 'true' }}
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        CUSTOM_GITHUB_REF: ${{ inputs.custom-github-ref }}
        CLI_ARTIFACT: ${{ inputs.cli-artifact }}
      run: bash $GITHUB_ACTION_PATH/../scripts/install-snowflake-cli.sh

    - name: Set up config.toml
      shell: bash
      run: bash $GITHUB_ACTION_PATH/../scripts/setup-config-file.sh
      env:
        CONFIG_FILE_PATH: ${{ inputs.default-config-file-path }}

    - name: Set up workload identity authentication
      if: ${{ inputs.use-oidc == 'true' }}
      shell: bash
      env:
        OIDC_TOKEN_NAME: ${{ inputs.oidc-token-name }}
        OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
      run: bash $GITHUB_ACTION_PATH/../scripts/configure-snowflake-oidc.sh

    - name: Output version
      id: version
      shell: bash
      run: bash $GITHUB_ACTION_PATH/../scripts/output-snowflake-cli-version.sh
