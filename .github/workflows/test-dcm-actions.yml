name: Test — DCM actions

on:
  pull_request:
    paths:
      - "dcm/**"
      - "scripts/**"
      - ".github/workflows/test-dcm-actions.yml"
  push:
    branches: [main]
    paths:
      - "dcm/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test-summary-structure:
    name: Unit test summary structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Test: the changeset section, colour coding and dropped repaints"
        shell: bash
        run: |
          set -e
          HARNESS="${RUNNER_TEMP}/summary-structure.test.sh"
          cat > "$HARNESS" <<'SH'
          #!/usr/bin/env bash
          # Behaviour tests for dcm_emit_changeset_summary: the changeset moves into a
          # collapsible section, open for plan and closed for deploy, identically in the job
          # summary and in the PR-comment copy, with the CLI's transient progress repaints
          # dropped from both.
          set -euo pipefail

          WORKSPACE="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE must be set}"
          SANDBOX="$(mktemp -d)"

          # Progress format of the released CLI: "❯ Step n/m - LABEL - verb".
          cat > "$SANDBOX/released.txt" <<'EOF'
          ❯ Step 1/5 - UPLOAD - ⠋ Running...
            • Create temporary stage inside DCM_DEMO.PROJECTS
            • Upload files
              ├── manifest.yml
              └── sources
          ❯ Step 1/5 - UPLOAD - ✓ Completed (1s)
          ❯ Step 2/5 - RENDER - ⠙ Running...
          ❯ Step 2/5 - RENDER - ✓ Completed (3s)
          ❯ Step 3/5 - COMPILE - ✓ Completed (0s)

          ALTER    DATABASE    DCM_ENV_DEMO_VAR
          └─ changed COMMENT: Build 5 → Build 6
          ALTER    TASK        DCM_ENV_DEMO_VAR.PUBLIC.LOAD
          └─ changed COMMENT: Running... nightly → Running... hourly
          CREATE   TABLE       DCM_ENV_DEMO_VAR.RAW.ORDERS
          DROP     VIEW        DCM_ENV_DEMO_VAR.SERVE.V_OLD

          Deployed 4 entities (1 created, 2 altered, 1 dropped).
          Artifacts saved to: /home/runner/work/x/out
          EOF

          # Progress format of a later CLI: "LABEL  ✓  (1.3s)", running steps spinner-only.
          cat > "$SANDBOX/redesigned.txt" <<'EOF'
          UPLOAD     ✓  (1.3s)
            Creating temporary stage inside DCM_DEMO.PROJECTS.
          PLAN       ⠋
          PLAN       ✓  (2.0s)
          CREATE   TABLE       MYDB.MYSCHEMA.T1
          Planned 1 entity (1 to create, 0 to alter, 0 to drop).
          EOF

          # A failure during a step: no changeset at all.
          cat > "$SANDBOX/failed.txt" <<'EOF'
          ❯ Step 2/5 - RENDER - ⠋ Running...
          ❯ Step 2/5 - RENDER - ✗ Failed (1s)
          Error: could not render sources/definitions/a.sql
          EOF

          # An empty changeset: the closing line is present, no rows.
          cat > "$SANDBOX/empty.txt" <<'EOF'
          ❯ Step 4/4 - PLAN - ✓ Completed (2s)
          No changes detected.
          EOF

          # A changeset the CLI never closed, because the command died mid-apply.
          cat > "$SANDBOX/truncated.txt" <<'EOF'
          ❯ Step 5/5 - DEPLOY - ✓ Completed (2s)
          ALTER    DATABASE    DCM_ENV_DEMO_VAR
          EOF

          emit() {
            local name="$1" output_file="$2" fold_state="$3"
            STEP_FILE="$SANDBOX/$name.step.md"
            COMMENT_FILE="$SANDBOX/$name.comment.md"
            : > "$STEP_FILE"
            : > "$COMMENT_FILE"
            (
              export GITHUB_STEP_SUMMARY="$STEP_FILE"
              export GHA_SUMMARY_FILE="$COMMENT_FILE"
              # shellcheck source=/dev/null
              . "$WORKSPACE/scripts/dcm-lib.sh"
              dcm_emit_changeset_summary success "DCM run to DEV successful" "$output_file" "$fold_state"
            )
          }

          fail() { echo "FAIL: $1"; shift; for f in "$@"; do echo "--- $f ---"; cat "$f"; done; exit 1; }
          assert_contains() { grep -qF -- "$2" "$1" || fail "$3" "$1"; }
          assert_missing() { ! grep -qF -- "$2" "$1" || fail "$3" "$1"; }

          # Count of fenced blocks must be even, or the markdown swallows what follows.
          assert_balanced() {
            local fences details closes
            fences=$(grep -c '^```$' "$1" || true)
            details=$(grep -c '^<details' "$1" || true)
            closes=$(grep -c '^</details>$' "$1" || true)
            [ $((fences % 2)) -eq 0 ] || fail "unbalanced code fences ($fences) in $2" "$1"
            [ "$details" -eq "$closes" ] || fail "unclosed details in $2 ($details open, $closes closed)" "$1"
          }

          # Plan: the section is open, and both channels are identical.
          emit plan-open "$SANDBOX/released.txt" open
          for channel in "$STEP_FILE" "$COMMENT_FILE"; do
            assert_contains "$channel" '<details open><summary>collapse/expand</summary>' 'plan opens the section'
            assert_contains "$channel" '🟨 ALTER    DATABASE    DCM_ENV_DEMO_VAR' 'ALTER rows are colour-coded'
            assert_contains "$channel" '🟩 CREATE   TABLE       DCM_ENV_DEMO_VAR.RAW.ORDERS' 'CREATE rows are colour-coded'
            assert_contains "$channel" '🟥 DROP     VIEW        DCM_ENV_DEMO_VAR.SERVE.V_OLD' 'DROP rows are colour-coded'
            assert_contains "$channel" '└─ changed COMMENT: Build 5 → Build 6' 'changeset detail lines are kept'
            assert_contains "$channel" '❯ Step 1/5 - UPLOAD - ✓ Completed (1s)' 'completed steps are kept'
            assert_contains "$channel" '    ├── manifest.yml' 'the uploaded file tree is kept'
            assert_contains "$channel" 'Deployed 4 entities (1 created, 2 altered, 1 dropped).' 'the totals line is kept'
            assert_contains "$channel" 'Artifacts saved to: /home/runner/work/x/out' 'trailing output is kept'
            assert_missing "$channel" 'UPLOAD - ⠋ Running...' 'transient repaints are dropped'
            assert_missing "$channel" 'RENDER - ⠙ Running...' 'every repaint is dropped, whatever the spinner frame'
            assert_contains "$channel" '└─ changed COMMENT: Running... nightly → Running... hourly' 'object text mentioning Running... survives'
            assert_balanced "$channel" 'plan-open'
          done
          cmp -s "$STEP_FILE" "$COMMENT_FILE" || fail 'the two channels diverge' "$STEP_FILE" "$COMMENT_FILE"
          echo 'PASS: plan renders an open section identically in both channels'

          # The steps sit above the section and the totals below it.
          python3 - "$COMMENT_FILE" <<'PY'
          import sys
          lines = open(sys.argv[1]).read().split('\n')
          opened = next(i for i, l in enumerate(lines) if l.startswith('<details'))
          closed = next(i for i, l in enumerate(lines) if l == '</details>')
          step = next(i for i, l in enumerate(lines) if 'UPLOAD - ✓ Completed' in l)
          row = next(i for i, l in enumerate(lines) if l.startswith('🟨 ALTER'))
          totals = next(i for i, l in enumerate(lines) if l.startswith('Deployed 4 entities'))
          assert step < opened, 'steps must precede the section'
          assert opened < row < closed, 'changeset rows must sit inside the section'
          assert totals > closed, 'the totals line must follow the section'
          PY
          echo 'PASS: steps precede the section, rows sit inside it, totals follow it'

          # Deploy: same rendering, section closed.
          emit deploy-closed "$SANDBOX/released.txt" closed
          assert_contains "$COMMENT_FILE" '<details><summary>collapse/expand</summary>' 'deploy closes the section'
          assert_missing "$COMMENT_FILE" '<details open>' 'deploy does not open the section'
          assert_contains "$COMMENT_FILE" '🟨 ALTER    DATABASE    DCM_ENV_DEMO_VAR' 'the rows are still present'
          assert_balanced "$COMMENT_FILE" 'deploy-closed'
          cmp -s "$STEP_FILE" "$COMMENT_FILE" || fail 'the two channels diverge' "$STEP_FILE" "$COMMENT_FILE"
          echo 'PASS: deploy renders the same section, closed, in both channels'

          # Omitting the fold state leaves the section open.
          emit default-state "$SANDBOX/redesigned.txt" ""
          assert_contains "$COMMENT_FILE" '<details open>' 'the default state is open'
          assert_contains "$COMMENT_FILE" 'UPLOAD     ✓  (1.3s)' 'completed rows of the newer layout are kept'
          assert_missing "$COMMENT_FILE" 'PLAN       ⠋' 'a spinner-only row is transient and is dropped'
          assert_contains "$COMMENT_FILE" '🟩 CREATE   TABLE       MYDB.MYSCHEMA.T1' 'the newer layout is colour-coded too'
          assert_balanced "$COMMENT_FILE" 'default-state'
          echo 'PASS: the fold state defaults to open'

          # No changeset rows: one flat block, no section.
          emit failed "$SANDBOX/failed.txt" open
          assert_missing "$COMMENT_FILE" '<details' 'a failure with no changeset gets no section'
          assert_contains "$COMMENT_FILE" '❯ Step 2/5 - RENDER - ✗ Failed (1s)' 'the failed step line is kept'
          assert_contains "$COMMENT_FILE" 'Error: could not render sources/definitions/a.sql' 'the error is kept'
          assert_balanced "$COMMENT_FILE" 'failed'
          echo 'PASS: output without a changeset is emitted flat'

          emit empty "$SANDBOX/empty.txt" open
          assert_missing "$COMMENT_FILE" '<details' 'an empty changeset gets no section'
          assert_contains "$COMMENT_FILE" 'No changes detected.' 'the empty-changeset line is kept'
          assert_balanced "$COMMENT_FILE" 'empty'
          echo 'PASS: an empty changeset is emitted flat'

          # A changeset with no closing line still has to be closed.
          emit truncated "$SANDBOX/truncated.txt" closed
          assert_contains "$COMMENT_FILE" '<details><summary>collapse/expand</summary>' 'the section is opened'
          assert_balanced "$COMMENT_FILE" 'truncated'
          echo 'PASS: a changeset with no closing line is still closed'

          # Empty output keeps the previous placeholder behaviour.
          : > "$SANDBOX/nothing.txt"
          emit nothing "$SANDBOX/nothing.txt" open
          assert_contains "$COMMENT_FILE" 'No output captured. Check the Actions log for details.' 'empty output keeps its placeholder'
          assert_balanced "$COMMENT_FILE" 'nothing'
          echo 'PASS: empty output keeps its placeholder'
          SH
          bash "$HARNESS"

  unit-test-pr-comment:
    name: Unit test pr-comment.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Test: comment size limiting and per-target isolation"
        shell: bash
        run: |
          set -e
          HARNESS="${RUNNER_TEMP}/pr-comment.test.js"
          cat > "$HARNESS" <<'JS'
          // Behaviour tests for postSummaryComment: size limiting and one comment per
          // action, target and project. The summary file it reads is produced by
          // dcm_emit_changeset_summary, which already applies the colour coding, drops the
          // CLI's transient progress repaints and builds the collapsible changeset section;
          // see the summary-structure test job for that half.
          const assert = require('node:assert');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');

          const { postSummaryComment } = require(`${process.env.GITHUB_WORKSPACE}/scripts/pr-comment.js`);

          const LIMIT = 65536;
          const FENCE = '```';
          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'prcomment-'));

          // A summary file in the shape the shell emitter produces.
          function planSummary(rowCount, { open = true } = {}) {
            const lines = [
              '### ✅ DCM Plan to PREPROD successful',
              FENCE,
              '❯ Step 1/4 - UPLOAD - ✓ Completed (1s)',
              '❯ Step 4/4 - PLAN - ✓ Completed (2s)',
              FENCE,
              '',
              `<details${open ? ' open' : ''}><summary>collapse/expand</summary>`,
              '',
              FENCE,
            ];
            for (let i = 0; i < rowCount; i++) {
              lines.push(`🟩 CREATE TABLE MYDB.MYSCHEMA.SOME_TABLE_${i}`);
            }
            lines.push(FENCE, '', '</details>', '', FENCE);
            lines.push(`Planned ${rowCount} entities (${rowCount} to create, 0 to alter, 0 to drop).`);
            lines.push(FENCE);
            return lines.join('\n') + '\n';
          }

          function summaryFile(name, contents) {
            const file = path.join(tmp, name);
            fs.writeFileSync(file, contents);
            return file;
          }

          function stubGithub(seed = []) {
            const store = new Map(seed.map(c => [c.id, { ...c }]));
            let nextId = 500;
            const calls = { created: 0, updated: 0 };
            return {
              store,
              calls,
              paginate: async () => [...store.values()],
              rest: {
                issues: {
                  listComments: async () => ({ data: [...store.values()] }),
                  createComment: async (p) => {
                    calls.created++;
                    const id = nextId++;
                    store.set(id, { id, body: p.body });
                  },
                  updateComment: async (p) => {
                    calls.updated++;
                    store.get(p.comment_id).body = p.body;
                  },
                },
                repos: {
                  listPullRequestsAssociatedWithCommit: async () => ({ data: [] }),
                },
              },
            };
          }

          const prContext = { eventName: 'pull_request', issue: { number: 7 }, repo: { owner: 'o', repo: 'r' }, runId: 42 };
          const only = (github) => [...github.store.values()][0];
          const bodies = (github) => [...github.store.values()].map(c => c.body);

          async function main() {
            // A summary that fits is posted verbatim, framed by the marker and the run link.
            {
              const github = stubGithub();
              const content = planSummary(3);
              await postSummaryComment(github, prContext, summaryFile('small.md', content), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              assert.equal(github.calls.created, 1, 'expected one comment to be created');
              assert.ok(body.startsWith('<!-- dcm-plan:PREPROD:proj -->\n'), 'the marker opens the body');
              assert.ok(body.includes(content.trimEnd()), 'the summary is posted unchanged');
              assert.ok(body.trimEnd().endsWith('/actions/runs/42)'), 'the run link closes the body');
              assert.ok(!body.includes('truncated'), 'a body that fits is not truncated');
              console.log('PASS: a summary within the limit is posted unchanged');
            }

            // The structure built by the shell is carried through untouched, in both states.
            for (const open of [true, false]) {
              const github = stubGithub();
              await postSummaryComment(github, prContext, summaryFile(`state-${open}.md`, planSummary(2, { open })), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              assert.ok(body.includes(open ? '<details open><summary>collapse/expand</summary>' : '<details><summary>collapse/expand</summary>'),
                `the ${open ? 'open' : 'closed'} section survives unchanged`);
              assert.ok(body.includes('🟩 CREATE TABLE MYDB.MYSCHEMA.SOME_TABLE_0'), 'the changeset rows survive');
            }
            console.log('PASS: the section state set by the emitter is left untouched');

            // A summary larger than the limit is truncated instead of failing the job.
            {
              const github = stubGithub();
              await postSummaryComment(github, prContext, summaryFile('big.md', planSummary(5000)), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              assert.ok(body.length <= LIMIT, `the body must fit the limit, got ${body.length}`);
              assert.ok(body.includes('Output truncated'), 'truncation is disclosed');
              assert.equal((body.match(/^```/gm) || []).length % 2, 0, 'code fences stay balanced');
              assert.ok(body.startsWith('<!-- dcm-plan:PREPROD:proj -->\n'), 'the marker survives truncation');
              assert.ok(body.trimEnd().endsWith('/actions/runs/42)'), 'the run link survives truncation');
              console.log('PASS: an oversized summary is truncated, fenced and still linked');
            }

            // Truncation inside the changeset section still closes that section.
            {
              const github = stubGithub();
              await postSummaryComment(github, prContext, summaryFile('cut.md', planSummary(5000)), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              assert.equal((body.match(/<details\b/g) || []).length, (body.match(/<\/details>/g) || []).length,
                'a section cut by truncation is still closed, or the markdown after it is swallowed');
              console.log('PASS: truncation closes a section it cut into');
            }

            // Truncation cuts on a line boundary, never mid-line.
            {
              const github = stubGithub();
              await postSummaryComment(github, prContext, summaryFile('boundary.md', planSummary(5000)), 'fallback', 'dcm-plan:PREPROD:proj');
              for (const row of only(github).body.split('\n').filter(l => l.startsWith('🟩 CREATE '))) {
                assert.match(row, /^🟩 CREATE TABLE MYDB\.MYSCHEMA\.SOME_TABLE_\d+$/, `row was cut mid-line: ${row}`);
              }
              console.log('PASS: truncation cuts on a line boundary');
            }

            // An unreadable summary file falls back to the caller's message.
            {
              const github = stubGithub();
              await postSummaryComment(github, prContext, path.join(tmp, 'absent.md'), 'Could not read plan summary.', 'dcm-plan:PREPROD:proj');
              assert.ok(only(github).body.includes('Could not read plan summary.'), 'the fallback text is used');
              console.log('PASS: a missing summary file falls back to the given message');
            }

            // A second run updates the existing comment rather than stacking a new one.
            {
              const github = stubGithub([{ id: 1, body: '<!-- dcm-plan:PREPROD:proj -->\nstale output\n' }]);
              await postSummaryComment(github, prContext, summaryFile('update.md', planSummary(2)), 'fallback', 'dcm-plan:PREPROD:proj');
              assert.equal(github.calls.created, 0, 'no new comment when the marker already exists');
              assert.equal(github.calls.updated, 1, 'the existing comment is updated');
              assert.equal(github.store.size, 1, 'the comment count stays at one');
              assert.ok(!github.store.get(1).body.includes('stale output'), 'the stale output is replaced');
              console.log('PASS: a marked comment is updated in place across runs');
            }

            // Plan and deploy, and each target and project, keep their own comment.
            {
              const github = stubGithub();
              for (const marker of [
                'dcm-plan:PREPROD:proj-a',
                'dcm-plan:PROD:proj-a',
                'dcm-plan:PREPROD:proj-b',
                'dcm-deploy:PREPROD:proj-a',
              ]) {
                await postSummaryComment(github, prContext, summaryFile('multi.md', planSummary(2)), 'fallback', marker);
              }
              assert.equal(github.store.size, 4, 'each action, target and project gets its own comment');

              await postSummaryComment(github, prContext, summaryFile('multi2.md', planSummary(9)), 'fallback', 'dcm-plan:PROD:proj-a');
              assert.equal(github.store.size, 4, 'no extra comment is created on the second run');
              const updated = bodies(github).filter(b => b.includes('Planned 9 entities'));
              assert.equal(updated.length, 1, 'only the matching comment is rewritten');
              assert.ok(updated[0].includes('<!-- dcm-plan:PROD:proj-a -->'), 'the rewritten comment is the matching one');
              console.log('PASS: comments for other targets, projects and actions are left alone');
            }

            // Without an associated PR there is nothing to comment on.
            {
              const github = stubGithub();
              const pushContext = { eventName: 'push', repo: { owner: 'o', repo: 'r' }, runId: 42, sha: 'deadbeef' };
              await postSummaryComment(github, pushContext, summaryFile('nopr.md', planSummary(2)), 'fallback', 'dcm-plan:PREPROD:proj');
              assert.equal(github.calls.created, 0, 'nothing is posted when no PR is associated');
              assert.equal(github.calls.updated, 0, 'nothing is updated when no PR is associated');
              console.log('PASS: a commit with no associated PR is skipped');
            }
          }

          main().catch((err) => {
            console.error(`FAIL: ${err.message}`);
            process.exit(1);
          });
          JS
          node "$HARNESS"
