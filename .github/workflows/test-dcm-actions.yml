name: Test — DCM actions

on:
  pull_request:
    paths:
      - "dcm/**"
      - "scripts/**"
      - ".github/workflows/test-dcm-actions.yml"
  push:
    branches: [main]
    paths:
      - "dcm/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test-pr-comment:
    name: Unit test pr-comment.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Test: comments stay within the size limit and update in place"
        shell: bash
        run: |
          set -e
          HARNESS="${RUNNER_TEMP}/pr-comment.test.js"
          cat > "$HARNESS" <<'JS'
          // Behaviour tests for postSummaryComment: size limiting and in-place updates.
          const assert = require('node:assert');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');

          const { postSummaryComment } = require(`${process.env.GITHUB_WORKSPACE}/scripts/pr-comment.js`);

          const LIMIT = 65536;
          const FENCE = '```';
          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'prcomment-'));

          function summaryFile(name, rowCount) {
            const lines = ['### ✅ DCM Plan to PREPROD successful', FENCE];
            for (let i = 0; i < rowCount; i++) {
              lines.push(`CREATE TABLE MYDB.MYSCHEMA.SOME_TABLE_${i}`);
            }
            lines.push(FENCE);
            const file = path.join(tmp, name);
            fs.writeFileSync(file, lines.join('\n') + '\n');
            return file;
          }

          // Minimal stand-in for the github client actions/github-script provides.
          function stubGithub(seed = []) {
            const store = new Map(seed.map(c => [c.id, { ...c }]));
            let nextId = 500;
            const calls = { created: 0, updated: 0 };
            return {
              store,
              calls,
              paginate: async () => [...store.values()],
              rest: {
                issues: {
                  listComments: async () => ({ data: [...store.values()] }),
                  createComment: async (p) => {
                    calls.created++;
                    const id = nextId++;
                    store.set(id, { id, body: p.body });
                  },
                  updateComment: async (p) => {
                    calls.updated++;
                    store.get(p.comment_id).body = p.body;
                  },
                },
                repos: {
                  listPullRequestsAssociatedWithCommit: async () => ({ data: [] }),
                },
              },
            };
          }

          const prContext = { eventName: 'pull_request', issue: { number: 7 }, repo: { owner: 'o', repo: 'r' }, runId: 42 };
          const only = (github) => [...github.store.values()][0];
          const bodies = (github) => [...github.store.values()].map(c => c.body);

          async function main() {

            // A summary that fits is posted verbatim, framed by the marker and the run link.
            {
              const github = stubGithub();
              await postSummaryComment(github, prContext, summaryFile('small.md', 3), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              assert.equal(github.calls.created, 1, 'expected one comment to be created');
              assert.ok(body.startsWith('<!-- dcm-plan:PREPROD:proj -->\n'), 'marker must open the body');
              assert.ok(body.includes('### ✅ DCM Plan to PREPROD successful'), 'heading must survive');
              assert.ok(body.includes('CREATE TABLE MYDB.MYSCHEMA.SOME_TABLE_2'), 'output must survive');
              assert.ok(body.trimEnd().endsWith('/actions/runs/42)'), 'run link must close the body');
              assert.ok(!body.includes('truncated'), 'a body that fits must not be truncated');
              console.log('PASS: a summary within the limit is posted unchanged');
            }

            // A summary larger than the limit is truncated instead of failing the job.
            {
              const github = stubGithub();
              await postSummaryComment(github, prContext, summaryFile('big.md', 5000), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              assert.ok(body.length <= LIMIT, `body must fit the limit, got ${body.length}`);
              assert.ok(body.includes('Output truncated'), 'truncation must be disclosed');
              assert.equal((body.match(/^```/gm) || []).length % 2, 0, 'code fences must stay balanced');
              assert.ok(body.startsWith('<!-- dcm-plan:PREPROD:proj -->\n'), 'marker must survive truncation');
              assert.ok(body.trimEnd().endsWith('/actions/runs/42)'), 'run link must survive truncation');
              assert.ok(body.includes('CREATE TABLE MYDB.MYSCHEMA.SOME_TABLE_0'), 'the head of the output is kept');
              console.log('PASS: an oversized summary is truncated, fenced and still linked');
            }

            // Truncation cuts on a line boundary, never mid-line.
            {
              const github = stubGithub();
              await postSummaryComment(github, prContext, summaryFile('boundary.md', 5000), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              const rows = body.split('\n').filter(l => l.startsWith('CREATE TABLE '));
              for (const row of rows) {
                assert.match(row, /^CREATE TABLE MYDB\.MYSCHEMA\.SOME_TABLE_\d+$/, `row was cut mid-line: ${row}`);
              }
              console.log('PASS: truncation cuts on a line boundary');
            }

            // An unreadable summary file falls back to the caller's message.
            {
              const github = stubGithub();
              await postSummaryComment(github, prContext, path.join(tmp, 'absent.md'), 'Could not read plan summary.', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              assert.ok(body.includes('Could not read plan summary.'), 'fallback text must be used');
              console.log('PASS: a missing summary file falls back to the given message');
            }

            // A second run updates the existing comment rather than stacking a new one.
            {
              const github = stubGithub([{ id: 1, body: '<!-- dcm-plan:PREPROD:proj -->\nstale output\n' }]);
              await postSummaryComment(github, prContext, summaryFile('update.md', 2), 'fallback', 'dcm-plan:PREPROD:proj');
              assert.equal(github.calls.created, 0, 'no new comment when the marker already exists');
              assert.equal(github.calls.updated, 1, 'the existing comment is updated');
              assert.equal(github.store.size, 1, 'the comment count stays at one');
              assert.ok(!github.store.get(1).body.includes('stale output'), 'stale output is replaced');
              console.log('PASS: a marked comment is updated in place across runs');
            }

            // Without an associated PR there is nothing to comment on.
            {
              const github = stubGithub();
              const pushContext = { eventName: 'push', repo: { owner: 'o', repo: 'r' }, runId: 42, sha: 'deadbeef' };
              await postSummaryComment(github, pushContext, summaryFile('nopr.md', 2), 'fallback', 'dcm-plan:PREPROD:proj');
              assert.equal(github.calls.created, 0, 'nothing is posted when no PR is associated');
              assert.equal(github.calls.updated, 0, 'nothing is updated when no PR is associated');
              console.log('PASS: a commit with no associated PR is skipped');
            }

            // Plan and deploy, and each target and project, keep their own comment.
            {
              const github = stubGithub();
              for (const marker of [
                'dcm-plan:PREPROD:proj-a',
                'dcm-plan:PROD:proj-a',
                'dcm-plan:PREPROD:proj-b',
                'dcm-deploy:PREPROD:proj-a',
              ]) {
                await postSummaryComment(github, prContext, summaryFile('multi.md', 2), 'fallback', marker);
              }
              assert.equal(github.store.size, 4, 'each kind, target and project gets its own comment');

              // A second run of one of them updates only that comment.
              fs.writeFileSync(path.join(tmp, 'multi.md'), '### ✅ second run\n');
              await postSummaryComment(github, prContext, path.join(tmp, 'multi.md'), 'fallback', 'dcm-plan:PROD:proj-a');
              assert.equal(github.store.size, 4, 'no extra comment is created on the second run');
              const updated = bodies(github).filter(b => b.includes('second run'));
              assert.equal(updated.length, 1, 'only the matching comment is rewritten');
              assert.ok(updated[0].includes('<!-- dcm-plan:PROD:proj-a -->'), 'the rewritten comment is the matching one');
              console.log('PASS: comments for other targets, projects and kinds are left alone');
            }
          }

          main().catch((err) => {
            console.error(`FAIL: ${err.message}`);
            process.exit(1);
          });
          JS
          node "$HARNESS"

  unit-test-summary-filter:
    name: Unit test summary output filtering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Test: transient progress repaints are left out of the PR comment"
        shell: bash
        run: |
          set -e
          HARNESS="${RUNNER_TEMP}/summary-filter.test.sh"
          cat > "$HARNESS" <<'SH'
          #!/usr/bin/env bash
          # Behaviour tests for the PR-comment output filter in gh-actions-lib.sh and
          # dcm-lib.sh: transient progress repaints are dropped from the comment, every
          # completed or failed step line is kept, and the job summary keeps everything.
          set -euo pipefail

          WORKSPACE="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE must be set}"
          SANDBOX="$(mktemp -d)"

          # Progress format of the released CLI: "❯ Step n/m - LABEL - verb".
          cat > "$SANDBOX/released.txt" <<'EOF'
          ❯ Step 1/5 - UPLOAD - ⠋ Running...
            • Create temporary stage inside DCM_DEMO.PROJECTS
            • Upload files
              ├── manifest.yml
              └── sources
          ❯ Step 1/5 - UPLOAD - ✓ Completed (1s)
          ❯ Step 2/5 - RENDER - ⠙ Running...
          ❯ Step 2/5 - RENDER - ✓ Completed (3s)
          ❯ Step 3/5 - COMPILE - ✓ Completed (0s)

          ALTER    DATABASE    DCM_ENV_DEMO_VAR
          └─ changed COMMENT: Build 5 → Build 6
          ALTER    TASK        DCM_ENV_DEMO_VAR.PUBLIC.LOAD
          └─ changed COMMENT: Running... nightly → Running... hourly

          Deployed 2 entities (0 created, 2 altered, 0 dropped).
          Artifacts saved to: /home/runner/work/x/out
          EOF

          # Progress format of a later CLI: "LABEL  ✓  (1.3s)", running steps spinner-only.
          cat > "$SANDBOX/redesigned.txt" <<'EOF'
          UPLOAD     ✓  (1.3s)
            Creating temporary stage inside DCM_DEMO.PROJECTS.
          RENDER     ✓  (3.0s)
          PLAN       ⠋
          PLAN       ✓  (2.0s)
          CREATE   TABLE       MYDB.MYSCHEMA.T1
          DROP     VIEW        MYDB.MYSCHEMA.V1
          Planned 2 entities (1 to create, 0 to alter, 1 to drop).
          EOF

          # A failure during a step: the failed step line is the diagnostic and must stay.
          cat > "$SANDBOX/failed.txt" <<'EOF'
          ❯ Step 2/5 - RENDER - ⠋ Running...
          ❯ Step 2/5 - RENDER - ✗ Failed (1s)
          Error: could not render sources/definitions/a.sql
          EOF

          # Render one output file through an emitter, into a fresh pair of summary files.
          emit() {
            local name="$1" emitter="$2" output_file="$3"
            STEP_FILE="$SANDBOX/$name.step.md"
            COMMENT_FILE="$SANDBOX/$name.comment.md"
            : > "$STEP_FILE"
            : > "$COMMENT_FILE"
            (
              export GITHUB_STEP_SUMMARY="$STEP_FILE"
              export GHA_SUMMARY_FILE="$COMMENT_FILE"
              # shellcheck source=/dev/null
              . "$WORKSPACE/scripts/dcm-lib.sh"
              "$emitter" success "DCM run to DEV successful" "$output_file"
            )
          }

          assert_contains() {
            grep -qF -- "$2" "$1" || { echo "FAIL: $3"; echo "--- $1 ---"; cat "$1"; exit 1; }
          }

          assert_missing() {
            if grep -qF -- "$2" "$1"; then
              echo "FAIL: $3"
              echo "--- $1 ---"
              cat "$1"
              exit 1
            fi
          }

          # Deploy output in the released progress format.
          emit released gha_emit_summary "$SANDBOX/released.txt"
          assert_missing "$COMMENT_FILE" 'UPLOAD - ⠋ Running...' 'a transient repaint must not reach the PR comment'
          assert_missing "$COMMENT_FILE" 'RENDER - ⠙ Running...' 'every transient repaint is dropped, whatever the spinner frame'
          assert_contains "$COMMENT_FILE" '❯ Step 1/5 - UPLOAD - ✓ Completed (1s)' 'completed step lines must be kept'
          assert_contains "$COMMENT_FILE" '❯ Step 3/5 - COMPILE - ✓ Completed (0s)' 'every completed step line must be kept'
          assert_contains "$COMMENT_FILE" '  • Create temporary stage inside DCM_DEMO.PROJECTS' 'step detail lines must be kept'
          assert_contains "$COMMENT_FILE" '    ├── manifest.yml' 'the uploaded file tree must be kept'
          assert_contains "$COMMENT_FILE" 'ALTER    DATABASE    DCM_ENV_DEMO_VAR' 'the changeset must be kept'
          assert_contains "$COMMENT_FILE" '└─ changed COMMENT: Running... nightly → Running... hourly' 'the pattern is anchored, so object text mentioning Running... is kept'
          assert_contains "$COMMENT_FILE" 'Deployed 2 entities (0 created, 2 altered, 0 dropped).' 'the summary line must be kept'
          assert_contains "$COMMENT_FILE" 'Artifacts saved to: /home/runner/work/x/out' 'trailing output must be kept'
          assert_contains "$STEP_FILE" 'UPLOAD - ⠋ Running...' 'the job summary keeps the transient lines too'
          echo 'PASS: transient repaints are dropped, completed steps and details are kept'

          # Plan output in the redesigned progress format, which the emoji coding also touches.
          emit redesigned dcm_emit_plan_summary "$SANDBOX/redesigned.txt"
          assert_missing "$COMMENT_FILE" 'PLAN       ⠋' 'a spinner-only row is transient and must be dropped'
          assert_contains "$COMMENT_FILE" 'UPLOAD     ✓  (1.3s)' 'completed rows of the newer layout must be kept'
          assert_contains "$COMMENT_FILE" 'PLAN       ✓  (2.0s)' 'the completed row replacing a spinner row must be kept'
          assert_contains "$COMMENT_FILE" '  Creating temporary stage inside DCM_DEMO.PROJECTS.' 'detail lines of the newer layout must be kept'
          assert_contains "$COMMENT_FILE" '🟩 CREATE   TABLE       MYDB.MYSCHEMA.T1' 'CREATE rows keep their marker'
          assert_contains "$COMMENT_FILE" '🟥 DROP     VIEW        MYDB.MYSCHEMA.V1' 'DROP rows keep their marker'
          assert_contains "$COMMENT_FILE" 'Planned 2 entities' 'the plan summary line must be kept'
          echo 'PASS: the newer progress layout is filtered the same way'

          # A failed step must survive: it is the only diagnostic in the comment.
          emit failed dcm_emit_plan_summary "$SANDBOX/failed.txt"
          assert_missing "$COMMENT_FILE" 'RENDER - ⠋ Running...' 'the transient line is still dropped on failure'
          assert_contains "$COMMENT_FILE" '❯ Step 2/5 - RENDER - ✗ Failed (1s)' 'the failed step line must reach the PR comment'
          assert_contains "$COMMENT_FILE" 'Error: could not render sources/definitions/a.sql' 'the error must reach the PR comment'
          echo 'PASS: a failed step and its error are kept'

          # The generic library filters nothing unless a caller sets a pattern.
          STEP_FILE="$SANDBOX/generic.step.md"
          COMMENT_FILE="$SANDBOX/generic.comment.md"
          : > "$STEP_FILE"
          : > "$COMMENT_FILE"
          (
            export GITHUB_STEP_SUMMARY="$STEP_FILE"
            export GHA_SUMMARY_FILE="$COMMENT_FILE"
            # shellcheck source=/dev/null
            . "$WORKSPACE/scripts/gh-actions-lib.sh"
            gha_emit_summary success "Generic command" "$SANDBOX/released.txt"
          )
          assert_contains "$COMMENT_FILE" 'UPLOAD - ⠋ Running...' 'gh-actions-lib alone must not filter anything'
          echo 'PASS: filtering is opt-in through GHA_COMMENT_DROP_REGEX'

          # Every case above must leave the job summary at least as complete as the comment.
          for name in released redesigned failed; do
            step_lines=$(wc -l < "$SANDBOX/$name.step.md")
            comment_lines=$(wc -l < "$SANDBOX/$name.comment.md")
            if [ "$step_lines" -lt "$comment_lines" ]; then
              echo "FAIL: job summary for $name is shorter than the PR comment"
              exit 1
            fi
          done
          echo 'PASS: the job summary is never shorter than the PR comment'
          SH
          bash "$HARNESS"
