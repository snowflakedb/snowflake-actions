name: Test — DCM actions

on:
  pull_request:
    paths:
      - "dcm/**"
      - "scripts/**"
      - ".github/workflows/test-dcm-actions.yml"
  push:
    branches: [main]
    paths:
      - "dcm/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test-summary-filter:
    name: Unit test summary output filtering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Test: transient progress repaints are left out of both summaries"
        shell: bash
        run: |
          set -e
          HARNESS="${RUNNER_TEMP}/summary-filter.test.sh"
          cat > "$HARNESS" <<'SH'
          #!/usr/bin/env bash
          # Behaviour tests for the output filter in gh-actions-lib.sh and dcm-lib.sh: the
          # CLI's transient progress repaints are left out of both the job summary and the
          # PR-comment copy, while every completed or failed step line is kept.
          set -euo pipefail

          WORKSPACE="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE must be set}"
          SANDBOX="$(mktemp -d)"

          # Progress format of the released CLI: "❯ Step n/m - LABEL - verb".
          cat > "$SANDBOX/released.txt" <<'EOF'
          ❯ Step 1/5 - UPLOAD - ⠋ Running...
            • Create temporary stage inside DCM_DEMO.PROJECTS
            • Upload files
              ├── manifest.yml
              └── sources
          ❯ Step 1/5 - UPLOAD - ✓ Completed (1s)
          ❯ Step 2/5 - RENDER - ⠙ Running...
          ❯ Step 2/5 - RENDER - ✓ Completed (3s)
          ❯ Step 3/5 - COMPILE - ✓ Completed (0s)

          ALTER    DATABASE    DCM_ENV_DEMO_VAR
          └─ changed COMMENT: Build 5 → Build 6
          ALTER    TASK        DCM_ENV_DEMO_VAR.PUBLIC.LOAD
          └─ changed COMMENT: Running... nightly → Running... hourly

          Deployed 2 entities (0 created, 2 altered, 0 dropped).
          Artifacts saved to: /home/runner/work/x/out
          EOF

          # Progress format of a later CLI: "LABEL  ✓  (1.3s)", running steps spinner-only.
          cat > "$SANDBOX/redesigned.txt" <<'EOF'
          UPLOAD     ✓  (1.3s)
            Creating temporary stage inside DCM_DEMO.PROJECTS.
          RENDER     ✓  (3.0s)
          PLAN       ⠋
          PLAN       ✓  (2.0s)
          CREATE   TABLE       MYDB.MYSCHEMA.T1
          DROP     VIEW        MYDB.MYSCHEMA.V1
          Planned 2 entities (1 to create, 0 to alter, 1 to drop).
          EOF

          # A failure during a step: the failed step line is the diagnostic and must stay.
          cat > "$SANDBOX/failed.txt" <<'EOF'
          ❯ Step 2/5 - RENDER - ⠋ Running...
          ❯ Step 2/5 - RENDER - ✗ Failed (1s)
          Error: could not render sources/definitions/a.sql
          EOF

          # Render one output file through an emitter, into a fresh pair of summary files.
          emit() {
            local name="$1" emitter="$2" output_file="$3"
            STEP_FILE="$SANDBOX/$name.step.md"
            COMMENT_FILE="$SANDBOX/$name.comment.md"
            : > "$STEP_FILE"
            : > "$COMMENT_FILE"
            (
              export GITHUB_STEP_SUMMARY="$STEP_FILE"
              export GHA_SUMMARY_FILE="$COMMENT_FILE"
              # shellcheck source=/dev/null
              . "$WORKSPACE/scripts/dcm-lib.sh"
              "$emitter" success "DCM run to DEV successful" "$output_file"
            )
          }

          assert_contains() {
            grep -qF -- "$2" "$1" || { echo "FAIL: $3"; echo "--- $1 ---"; cat "$1"; exit 1; }
          }

          assert_missing() {
            if grep -qF -- "$2" "$1"; then
              echo "FAIL: $3"
              echo "--- $1 ---"
              cat "$1"
              exit 1
            fi
          }

          # Deploy output in the released progress format.
          emit released gha_emit_summary "$SANDBOX/released.txt"
          for channel in "$STEP_FILE" "$COMMENT_FILE"; do
            assert_missing "$channel" 'UPLOAD - ⠋ Running...' 'a transient repaint must not reach either summary'
            assert_missing "$channel" 'RENDER - ⠙ Running...' 'every repaint is dropped, whatever the spinner frame'
            assert_contains "$channel" '❯ Step 1/5 - UPLOAD - ✓ Completed (1s)' 'completed step lines must be kept'
            assert_contains "$channel" '❯ Step 3/5 - COMPILE - ✓ Completed (0s)' 'every completed step line must be kept'
            assert_contains "$channel" '  • Create temporary stage inside DCM_DEMO.PROJECTS' 'step detail lines must be kept'
            assert_contains "$channel" '    ├── manifest.yml' 'the uploaded file tree must be kept'
            assert_contains "$channel" 'ALTER    DATABASE    DCM_ENV_DEMO_VAR' 'the changeset must be kept'
            assert_contains "$channel" '└─ changed COMMENT: Running... nightly → Running... hourly' 'the pattern is anchored, so object text mentioning Running... is kept'
            assert_contains "$channel" 'Deployed 2 entities (0 created, 2 altered, 0 dropped).' 'the totals line must be kept'
            assert_contains "$channel" 'Artifacts saved to: /home/runner/work/x/out' 'trailing output must be kept'
          done
          echo 'PASS: repaints are dropped from both summaries, completed steps kept'

          # Plan output in the redesigned progress format, which the emoji coding also touches.
          emit redesigned dcm_emit_plan_summary "$SANDBOX/redesigned.txt"
          for channel in "$STEP_FILE" "$COMMENT_FILE"; do
            assert_missing "$channel" 'PLAN       ⠋' 'a spinner-only row is transient and must be dropped'
            assert_contains "$channel" 'UPLOAD     ✓  (1.3s)' 'completed rows of the newer layout must be kept'
            assert_contains "$channel" 'PLAN       ✓  (2.0s)' 'the completed row replacing a spinner row must be kept'
            assert_contains "$channel" '  Creating temporary stage inside DCM_DEMO.PROJECTS.' 'detail lines of the newer layout must be kept'
            assert_contains "$channel" '🟩 CREATE   TABLE       MYDB.MYSCHEMA.T1' 'CREATE rows keep their marker'
            assert_contains "$channel" '🟥 DROP     VIEW        MYDB.MYSCHEMA.V1' 'DROP rows keep their marker'
            assert_contains "$channel" 'Planned 2 entities' 'the plan summary line must be kept'
          done
          echo 'PASS: the newer progress layout is filtered the same way'

          # A failed step must survive: it is the only diagnostic in the summary.
          emit failed dcm_emit_plan_summary "$SANDBOX/failed.txt"
          for channel in "$STEP_FILE" "$COMMENT_FILE"; do
            assert_missing "$channel" 'RENDER - ⠋ Running...' 'the repaint is still dropped on failure'
            assert_contains "$channel" '❯ Step 2/5 - RENDER - ✗ Failed (1s)' 'the failed step line must be kept'
            assert_contains "$channel" 'Error: could not render sources/definitions/a.sql' 'the error must be kept'
          done
          echo 'PASS: a failed step and its error are kept'

          # The generic library filters nothing unless a caller sets a pattern.
          STEP_FILE="$SANDBOX/generic.step.md"
          COMMENT_FILE="$SANDBOX/generic.comment.md"
          : > "$STEP_FILE"
          : > "$COMMENT_FILE"
          (
            export GITHUB_STEP_SUMMARY="$STEP_FILE"
            export GHA_SUMMARY_FILE="$COMMENT_FILE"
            unset GHA_OUTPUT_DROP_REGEX
            # shellcheck source=/dev/null
            . "$WORKSPACE/scripts/gh-actions-lib.sh"
            gha_emit_summary success "Generic command" "$SANDBOX/released.txt"
          )
          assert_contains "$COMMENT_FILE" 'UPLOAD - ⠋ Running...' 'gh-actions-lib alone must not filter anything'
          echo 'PASS: filtering is opt-in through GHA_OUTPUT_DROP_REGEX'

          # Both channels receive the same output.
          for name in released redesigned failed; do
            if ! diff -q "$SANDBOX/$name.step.md" "$SANDBOX/$name.comment.md" > /dev/null; then
              echo "FAIL: the two summary channels diverge for $name"
              diff "$SANDBOX/$name.step.md" "$SANDBOX/$name.comment.md" || true
              exit 1
            fi
          done
          echo 'PASS: the job summary and the PR-comment copy start from identical output'
          SH
          bash "$HARNESS"

  unit-test-pr-comment:
    name: Unit test pr-comment.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Test: comment size, structure and per-target isolation"
        shell: bash
        run: |
          set -e
          HARNESS="${RUNNER_TEMP}/pr-comment.test.js"
          cat > "$HARNESS" <<'JS'
          // Behaviour tests for postSummaryComment: size limiting, in-place updates, and
          // the comment-only restructuring driven by the COMMENT_* environment variables.
          const assert = require('node:assert');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');

          const { postSummaryComment } = require(`${process.env.GITHUB_WORKSPACE}/scripts/pr-comment.js`);

          // The summary file is written by the shell libraries, which already leave the
          // CLI's transient progress repaints out; see the summary-filter test job.

          const LIMIT = 65536;
          const FENCE = '```';
          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'prcomment-'));

          // What dcm_emit_plan_summary writes: one heading and one fenced block holding the
          // CLI output, with CREATE/ALTER/DROP rows colour-coded.
          function planSummary(rowCount, { steps = true, totals = true } = {}) {
            const lines = ['### ✅ DCM Plan to PREPROD successful', FENCE];
            if (steps) {
              lines.push('  • Create temporary stage inside DCM_DEMO.PROJECTS');
              lines.push('❯ Step 1/4 - UPLOAD - ✓ Completed (1s)');
              lines.push('❯ Step 4/4 - PLAN - ✓ Completed (2s)');
              lines.push('');
            }
            for (let i = 0; i < rowCount; i++) {
              lines.push(`🟩 CREATE TABLE MYDB.MYSCHEMA.SOME_TABLE_${i}`);
            }
            if (totals) {
              lines.push('');
              lines.push(`Planned ${rowCount} entities (${rowCount} to create, 0 to alter, 0 to drop).`);
              lines.push('Artifacts saved to: /home/runner/work/x/out');
            }
            lines.push(FENCE);
            return lines.join('\n') + '\n';
          }

          function summaryFile(name, contents) {
            const file = path.join(tmp, name);
            fs.writeFileSync(file, contents);
            return file;
          }

          // The DCM actions set these on the comment step; unset means no restructuring.
          function withFoldConfig(enabled) {
            if (!enabled) {
              delete process.env.COMMENT_FOLD_START_REGEX;
              delete process.env.COMMENT_FOLD_END_REGEX;
              delete process.env.COMMENT_FOLD_LABEL;
              return;
            }
            process.env.COMMENT_FOLD_START_REGEX = '^(?:[🟩🟨🟥] )?(?:CREATE|ALTER|DROP)\\s';
            process.env.COMMENT_FOLD_END_REGEX = '^(?:Planned|Deployed|Purged|No changes detected)';
            process.env.COMMENT_FOLD_LABEL = 'Changeset';
          }

          function stubGithub(seed = []) {
            const store = new Map(seed.map(c => [c.id, { ...c }]));
            let nextId = 500;
            const calls = { created: 0, updated: 0 };
            return {
              store,
              calls,
              paginate: async () => [...store.values()],
              rest: {
                issues: {
                  listComments: async () => ({ data: [...store.values()] }),
                  createComment: async (p) => {
                    calls.created++;
                    const id = nextId++;
                    store.set(id, { id, body: p.body });
                  },
                  updateComment: async (p) => {
                    calls.updated++;
                    store.get(p.comment_id).body = p.body;
                  },
                },
                repos: {
                  listPullRequestsAssociatedWithCommit: async () => ({ data: [] }),
                },
              },
            };
          }

          const prContext = { eventName: 'pull_request', issue: { number: 7 }, repo: { owner: 'o', repo: 'r' }, runId: 42 };
          const only = (github) => [...github.store.values()][0];
          const bodies = (github) => [...github.store.values()].map(c => c.body);
          const inFoldOf = (body) => body.slice(body.indexOf('<details'), body.indexOf('</details>'));

          async function main() {
            // The changeset moves into its own section, expanded by default.
            {
              withFoldConfig(true);
              const github = stubGithub();
              await postSummaryComment(github, prContext, summaryFile('fold.md', planSummary(3)), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;

              assert.ok(body.includes('<details open><summary>Changeset</summary>'),
                'the changeset sits in a section that is expanded by default');
              assert.ok(body.includes('</details>'), 'the fold is closed');

              const foldStart = body.indexOf('<details');
              const foldEnd = body.indexOf('</details>');
              const inFold = body.slice(foldStart, foldEnd);
              const beforeFold = body.slice(0, foldStart);
              const afterFold = body.slice(foldEnd);

              assert.ok(beforeFold.includes('### ✅ DCM Plan to PREPROD successful'), 'the heading stays visible');
              assert.ok(beforeFold.includes('❯ Step 1/4 - UPLOAD - ✓ Completed (1s)'), 'completed steps stay visible');
              assert.ok(beforeFold.includes('  • Create temporary stage inside DCM_DEMO.PROJECTS'), 'step details stay visible');
              assert.ok(inFold.includes('🟩 CREATE TABLE MYDB.MYSCHEMA.SOME_TABLE_0'), 'changeset rows go into the fold');
              assert.ok(afterFold.includes('Planned 3 entities (3 to create, 0 to alter, 0 to drop).'), 'the totals line stays visible below the fold');
              assert.ok(afterFold.includes('Artifacts saved to: /home/runner/work/x/out'), 'trailing output stays visible');
              assert.equal((body.match(/^```/gm) || []).length % 2, 0, 'every fenced block is closed');
              console.log('PASS: the changeset is in an expanded section, steps and totals stay visible');
            }

            // An empty changeset has no rows to fold, so nothing is folded.
            {
              withFoldConfig(true);
              const github = stubGithub();
              const empty = `### ✅ DCM Plan to PREPROD successful\n${FENCE}\n❯ Step 4/4 - PLAN - ✓ Completed (2s)\nNo changes detected.\n${FENCE}\n`;
              await postSummaryComment(github, prContext, summaryFile('empty.md', empty), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              assert.ok(!body.includes('<details'), 'with no changeset rows there is nothing to fold');
              assert.ok(body.includes('No changes detected.'), 'the empty-changeset line is kept');
              console.log('PASS: an empty changeset is left unfolded');
            }

            // A failure before any changeset keeps the diagnostic visible and unfolded.
            {
              withFoldConfig(true);
              const github = stubGithub();
              const failed = `### ❌ DCM Plan to PREPROD failed\n${FENCE}\n❯ Step 2/4 - RENDER - ✗ Failed (1s)\nError: could not render sources/definitions/a.sql\n${FENCE}\n`;
              await postSummaryComment(github, prContext, summaryFile('failed.md', failed), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              assert.ok(!body.includes('<details'), 'a failure with no changeset is not folded');
              assert.ok(body.includes('❯ Step 2/4 - RENDER - ✗ Failed (1s)'), 'the failed step line is visible');
              assert.ok(body.includes('Error: could not render sources/definitions/a.sql'), 'the error is visible');
              console.log('PASS: a failure keeps its diagnostic visible');
            }

            // A detail line under a changeset row belongs inside the fold with it.
            {
              withFoldConfig(true);
              const github = stubGithub();
              const withComment = `### ✅ DCM Deploy to DEV successful\n${FENCE}\n❯ Step 5/5 - DEPLOY - ✓ Completed (2s)\n🟨 ALTER TASK MYDB.PUBLIC.LOAD\n└─ changed COMMENT: nightly → hourly\nDeployed 1 entity (0 created, 1 altered, 0 dropped).\n${FENCE}\n`;
              await postSummaryComment(github, prContext, summaryFile('mention.md', withComment), 'fallback', 'dcm-deploy:DEV:proj');
              const body = only(github).body;
              assert.ok(inFoldOf(body).includes('└─ changed COMMENT: nightly → hourly'),
                'a changeset detail line is folded with the row it belongs to');
              console.log('PASS: changeset detail lines are folded with their row');
            }

            // Sections outside the output block, such as the DROP guard, are untouched.
            {
              withFoldConfig(true);
              const github = stubGithub();
              const guarded =
                `### ✅ PLAN contains no DROP DATABASE | SCHEMA | TABLE | STAGE commands\n` +
                `### ✅ DCM Deploy to DEV successful\n${FENCE}\n🟩 CREATE TABLE MYDB.MYSCHEMA.T1\nDeployed 1 entity (1 created, 0 altered, 0 dropped).\n${FENCE}\n` +
                `### ✅ 2 of 2 post-scripts succeeded\n${FENCE}\n- 001_seed.sql\n- 002_grants.sql\n${FENCE}\n`;
              await postSummaryComment(github, prContext, summaryFile('guard.md', guarded), 'fallback', 'dcm-deploy:DEV:proj');
              const body = only(github).body;
              assert.equal((body.match(/<details\b/g) || []).length, 1, 'only the block holding the changeset is folded');
              assert.ok(body.includes('### ✅ PLAN contains no DROP DATABASE | SCHEMA | TABLE | STAGE commands'), 'the guard section is untouched');
              assert.ok(body.includes('- 001_seed.sql'), 'the post-scripts section is untouched');
              console.log('PASS: other sections of the summary are left alone');
            }

            // With the variables unset the content is posted exactly as written.
            {
              withFoldConfig(false);
              const github = stubGithub();
              const content = planSummary(2);
              await postSummaryComment(github, prContext, summaryFile('raw.md', content), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              assert.ok(!body.includes('<details'), 'no restructuring without the COMMENT_* variables');
              assert.ok(body.includes('🟩 CREATE TABLE MYDB.MYSCHEMA.SOME_TABLE_0'), 'the changeset stays inline');
              console.log('PASS: restructuring is opt-in through the COMMENT_* variables');
            }

            // A summary that fits is framed by the marker and the run link.
            {
              withFoldConfig(true);
              const github = stubGithub();
              await postSummaryComment(github, prContext, summaryFile('small.md', planSummary(3)), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              assert.equal(github.calls.created, 1, 'expected one comment to be created');
              assert.ok(body.startsWith('<!-- dcm-plan:PREPROD:proj -->\n'), 'marker must open the body');
              assert.ok(body.trimEnd().endsWith('/actions/runs/42)'), 'run link must close the body');
              assert.ok(!body.includes('truncated'), 'a body that fits must not be truncated');
              console.log('PASS: a summary within the limit is posted with marker and run link');
            }

            // An oversized changeset is truncated, and the fold is closed even so.
            {
              withFoldConfig(true);
              const github = stubGithub();
              await postSummaryComment(github, prContext, summaryFile('big.md', planSummary(5000)), 'fallback', 'dcm-plan:PREPROD:proj');
              const body = only(github).body;
              assert.ok(body.length <= LIMIT, `body must fit the limit, got ${body.length}`);
              assert.ok(body.includes('Output truncated'), 'truncation must be disclosed');
              assert.equal((body.match(/^```/gm) || []).length % 2, 0, 'code fences must stay balanced');
              assert.equal((body.match(/<details\b/g) || []).length, (body.match(/<\/details>/g) || []).length,
                'a fold cut by truncation is still closed');
              assert.ok(body.trimEnd().endsWith('/actions/runs/42)'), 'run link must survive truncation');
              console.log('PASS: an oversized changeset is truncated with the fold closed');
            }

            // Truncation cuts on a line boundary, never mid-line.
            {
              withFoldConfig(true);
              const github = stubGithub();
              await postSummaryComment(github, prContext, summaryFile('boundary.md', planSummary(5000)), 'fallback', 'dcm-plan:PREPROD:proj');
              for (const row of only(github).body.split('\n').filter(l => l.startsWith('🟩 CREATE '))) {
                assert.match(row, /^🟩 CREATE TABLE MYDB\.MYSCHEMA\.SOME_TABLE_\d+$/, `row was cut mid-line: ${row}`);
              }
              console.log('PASS: truncation cuts on a line boundary');
            }

            // An unreadable summary file falls back to the caller's message.
            {
              withFoldConfig(true);
              const github = stubGithub();
              await postSummaryComment(github, prContext, path.join(tmp, 'absent.md'), 'Could not read plan summary.', 'dcm-plan:PREPROD:proj');
              assert.ok(only(github).body.includes('Could not read plan summary.'), 'fallback text must be used');
              console.log('PASS: a missing summary file falls back to the given message');
            }

            // A second run updates the existing comment rather than stacking a new one.
            {
              withFoldConfig(true);
              const github = stubGithub([{ id: 1, body: '<!-- dcm-plan:PREPROD:proj -->\nstale output\n' }]);
              await postSummaryComment(github, prContext, summaryFile('update.md', planSummary(2)), 'fallback', 'dcm-plan:PREPROD:proj');
              assert.equal(github.calls.created, 0, 'no new comment when the marker already exists');
              assert.equal(github.calls.updated, 1, 'the existing comment is updated');
              assert.equal(github.store.size, 1, 'the comment count stays at one');
              assert.ok(!github.store.get(1).body.includes('stale output'), 'stale output is replaced');
              console.log('PASS: a marked comment is updated in place across runs');
            }

            // Plan and deploy, and each target and project, keep their own comment.
            {
              withFoldConfig(true);
              const github = stubGithub();
              for (const marker of [
                'dcm-plan:PREPROD:proj-a',
                'dcm-plan:PROD:proj-a',
                'dcm-plan:PREPROD:proj-b',
                'dcm-deploy:PREPROD:proj-a',
              ]) {
                await postSummaryComment(github, prContext, summaryFile('multi.md', planSummary(2)), 'fallback', marker);
              }
              assert.equal(github.store.size, 4, 'each kind, target and project gets its own comment');

              await postSummaryComment(github, prContext, summaryFile('multi2.md', planSummary(9)), 'fallback', 'dcm-plan:PROD:proj-a');
              assert.equal(github.store.size, 4, 'no extra comment is created on the second run');
              const updated = bodies(github).filter(b => b.includes('Planned 9 entities'));
              assert.equal(updated.length, 1, 'only the matching comment is rewritten');
              assert.ok(updated[0].includes('<!-- dcm-plan:PROD:proj-a -->'), 'the rewritten comment is the matching one');
              console.log('PASS: comments for other targets, projects and kinds are left alone');
            }

            // Without an associated PR there is nothing to comment on.
            {
              withFoldConfig(true);
              const github = stubGithub();
              const pushContext = { eventName: 'push', repo: { owner: 'o', repo: 'r' }, runId: 42, sha: 'deadbeef' };
              await postSummaryComment(github, pushContext, summaryFile('nopr.md', planSummary(2)), 'fallback', 'dcm-plan:PREPROD:proj');
              assert.equal(github.calls.created, 0, 'nothing is posted when no PR is associated');
              assert.equal(github.calls.updated, 0, 'nothing is updated when no PR is associated');
              console.log('PASS: a commit with no associated PR is skipped');
            }
          }

          main().catch((err) => {
            console.error(`FAIL: ${err.message}`);
            process.exit(1);
          });
          JS
          node "$HARNESS"
